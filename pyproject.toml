[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bball-comparison"
version = "0.1.0"
description = "NBA Player Comparison Engine - find similar players based on stats, trajectories, and team composition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nba_api",
    "pandas",
    "numpy",
    "scikit-learn>=1.4,<2",
    # The 1.15 macOS Python 3.10 wheel fails native loading on the development host.
    "scipy>=1.13,<1.15; sys_platform == 'darwin' and python_version == '3.10'",
    "streamlit>=1.40,<2",
    "beautifulsoup4",
    "requests",
    "lxml",
    "pyarrow",
]

[project.optional-dependencies]
trajectory = ["dtw-python>=1.5,<2"]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # HTML templates contain intentionally long lines.

[tool.ruff.lint.per-file-ignores]
"src/app/streamlit_app.py" = ["E402"]  # Streamlit entry-point path setup.
